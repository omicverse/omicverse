name: Communication correctness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'omicverse/space/_commot.py'
      - 'omicverse/space/_communication.py'
      - 'omicverse/external/commot/**'
      - 'omicverse/external/flowsig/**'
      - 'tests/external/test_commot*'
      - 'tests/external/test_flowsig*'
      - 'tests/space/test_comm*'
      - 'pyproject.toml'
      - '.github/workflows/communication.yml'
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "torch>=2.0,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[commot,flowsig]" pytest
      - name: Real CPU inference, summaries and roundtrip
        run: python -X utf8 -m pytest tests/external/test_commot_flowsig_correctness.py tests/external/test_flowsig_network.py tests/external/test_flowsig_pkg_resources_compat.py tests/space/test_commot_summary_contract.py tests/space/test_communication_runners.py -q -rs
