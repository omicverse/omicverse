# The gate that was missing.
#
# `pip install "omicverse[synbio]"` was unresolvable from the day ov.synbio
# landed (#887) until #912 — one dependency (rs3) pinned scikit-learn<=1.0.2
# against omicverse's own >=1.2, which took all of its ~20 siblings down with
# it. Nothing caught it because the main workflow only ever installs
# `.[tests,mcp]`, and the module's two verification scripts were not named
# test_*.py so pytest never collected them.
#
# Two jobs, deliberately split by cost. Both timings measured in a clean
# python:3.11 x86_64 container against this pyproject:
#   resolve  — 11s, 203 packages. Proves the extra is satisfiable on every
#              supported Python. This job alone would have caught rs3.
#   install  — 137s, 6.1 GB on disk (pytorch-lightning pulls torch). Proves the
#              resolved set actually installs and that layer A really solves.
name: synbio extra

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  resolve:
    name: resolve (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Resolve the synbio extra
        run: |
          uv pip compile \
            --python-version ${{ matrix.python-version }} \
            --extra synbio pyproject.toml \
            -o synbio-requirements-${{ matrix.python-version }}.txt
          echo "resolved $(grep -c '^[a-zA-Z]' synbio-requirements-${{ matrix.python-version }}.txt) packages"
      - name: Explain a resolution failure
        if: failure()
        run: |
          echo "::error::omicverse[synbio] no longer resolves on Python ${{ matrix.python-version }}."
          echo "A dependency you just added conflicts with omicverse's own floors."
          echo "This makes the ENTIRE extra uninstallable, not just that one package —"
          echo "every other synbio dependency becomes unreachable too. See the rs3"
          echo "case in pyproject.toml's synbio block (fixed in #912) for precedent."
          echo "If the package is genuinely needed but unresolvable, fetch it at"
          echo "runtime with --no-deps instead, like omicverse/synbio/_rs3.py does."

  install:
    name: install + layer-A smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-synbio-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-synbio-
      - name: Install omicverse[synbio]
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python ".[synbio]" pytest
      - name: Layer-A smoke (COBRApy / FBA / enzyme-constrained model)
        run: |
          .venv/bin/python -m pytest tests/test_synbio_coupling.py -v -rs
      - name: CRISPR + extra guards
        run: |
          .venv/bin/python -m pytest tests/test_synbio_crispr.py -v -rs
      - name: Confirm the GPU suite skips rather than fails on a CPU runner
        run: |
          .venv/bin/python -m pytest tests/test_synbio_gpu.py -rs \
            | tee gpu.log
          grep -qE "skipped|no tests ran" gpu.log
